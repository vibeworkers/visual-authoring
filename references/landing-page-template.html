<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- PAGE_TITLE --></title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  /* ── Base Tokens (references/tokens-css.md) ── */
  :root {
    --cds-background:       #ffffff;
    --cds-layer-01:         #f4f4f4;
    --cds-layer-02:         #e0e0e0;
    --cds-text-primary:     #161616;
    --cds-text-secondary:   #525252;
    --cds-text-on-color:    #ffffff;
    --cds-interactive:      #0f62fe;
    --cds-interactive-hover:#0353e9;
    --cds-support-success:  #24a148;
    --cds-border-subtle:    #e0e0e0;
    --cds-focus:            #0f62fe;
    --cds-highlight:        #d0e2ff;

    --cds-font-sans:  'Noto Sans KR', 'Inter', -apple-system, sans-serif;
    --cds-font-mono:  'IBM Plex Mono', 'Menlo', monospace;

    --cds-radius-sm: 10px;
    --cds-radius-md: 16px;
    --cds-shadow-md: 0 4px 24px rgba(15,23,42,0.08);
    --cds-shadow-lg: 0 12px 48px rgba(15,23,42,0.12);

    /* ── Page-specific Semantic Tokens (extend here) ── */
    --cds-hero-start: #0f172a;
    --cds-hero-mid:   #1e3a5f;
    --cds-hero-end:   #1e40af;
    --cds-accent:     #f59e0b;
  }

  /* ── Reset ── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--cds-font-sans);
    color: var(--cds-text-primary);
    line-height: 1.7;
    background: var(--cds-background);
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ── Section Pattern ── */
  section { padding: 100px 0; }
  .section-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--cds-interactive);
    margin-bottom: 12px;
  }
  .section-title {
    font-size: clamp(28px, 3.5vw, 42px);
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }
  .section-desc {
    font-size: 17px;
    color: var(--cds-text-secondary);
    max-width: 640px;
    line-height: 1.8;
  }
  .text-center { text-align: center; }
  .mx-auto { margin-left: auto; margin-right: auto; }

  /* ── Hero (full-bleed) ── */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: linear-gradient(135deg,
      var(--cds-hero-start) 0%,
      var(--cds-hero-mid) 50%,
      var(--cds-hero-end) 100%);
    overflow: hidden;
  }
  .hero .container { position: relative; z-index: 1; padding-top: 80px; padding-bottom: 80px; }
  .hero h1 {
    font-size: clamp(36px, 5.5vw, 64px);
    font-weight: 900;
    color: var(--cds-text-on-color);
    line-height: 1.2;
    margin-bottom: 24px;
  }
  .hero-sub {
    font-size: clamp(17px, 2vw, 20px);
    color: rgba(255,255,255,0.7);
    max-width: 620px;
    margin-bottom: 48px;
    line-height: 1.9;
  }

  /* ── Support ── */
  /* ── Detail ── */
  /* ── CTA ── */

  /* ── Scroll Reveal ── */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    section { padding: 64px 0; }
    .container { padding: 0 16px; }
  }
</style>
</head>
<body>

<!-- ===== HERO ===== -->
<section class="hero">
  <div class="container">
    <h1><!-- HEADLINE --></h1>
    <p class="hero-sub"><!-- SUB_HEADLINE --></p>
    <!-- hero-stats, CTA button, etc. -->
  </div>
</section>

<!-- ===== SUPPORT ===== -->
<section class="reveal">
  <div class="container">
    <p class="section-label"><!-- LABEL --></p>
    <h2 class="section-title"><!-- TITLE --></h2>
    <p class="section-desc mx-auto"><!-- DESC --></p>
  </div>
</section>

<!-- ===== DETAIL ===== -->
<section style="background: var(--cds-layer-01);" class="reveal">
  <div class="container">
    <p class="section-label"><!-- LABEL --></p>
    <h2 class="section-title"><!-- TITLE --></h2>
    <!-- content grid, cards, curriculum, etc. -->
  </div>
</section>

<!-- ===== FINAL CTA ===== -->
<section class="hero" style="min-height: auto; padding: 80px 0;">
  <div class="container text-center">
    <h2 style="color: var(--cds-text-on-color); font-size: clamp(28px, 4vw, 48px); font-weight: 800;">
      <!-- CTA_HEADLINE -->
    </h2>
    <!-- CTA cards / buttons -->
  </div>
</section>

<footer style="background: var(--cds-text-primary); color: rgba(255,255,255,0.5); padding: 24px 0; text-align: center; font-size: 13px;">
  <div class="container">&copy; <!-- YEAR --> <!-- BRAND -->. All rights reserved.</div>
</footer>

<script>
// Scroll reveal (IntersectionObserver)
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); } });
}, { threshold: 0.15 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
</body>
</html>
